<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Personal Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 16px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #e94560;
    }

    .header .subtitle {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .context-bar {
      margin-top: 8px;
      width: 100%;
      height: 4px;
      background: #2a2a4a;
      border-radius: 2px;
      overflow: hidden;
    }

    .context-bar-fill {
      height: 100%;
      width: 0%;
      background: #0f3460;
      border-radius: 2px;
      transition: width 0.3s, background 0.3s;
    }

    .context-bar-fill.warning {
      background: #e9a560;
    }

    .context-bar-fill.critical {
      background: #e94560;
    }

    .context-label {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #0f3460;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #2a2a4a;
      color: #eee;
      border-bottom-left-radius: 4px;
    }

    .message.system {
      align-self: center;
      background: transparent;
      color: #888;
      font-size: 13px;
      padding: 4px;
    }

    .input-area {
      padding: 16px 20px;
      background: #16213e;
      border-top: 1px solid #0f3460;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .text-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #eee;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .text-input:focus {
      border-color: #e94560;
    }

    .text-input::placeholder {
      color: #666;
    }

    .btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-send {
      background: #e94560;
      color: white;
    }

    .btn-send:hover {
      background: #ff6b81;
    }

    .btn-send:disabled {
      background: #444;
      cursor: not-allowed;
    }

    .btn-stop {
      background: #e94560;
      color: white;
    }

    .btn-stop:hover {
      background: #ff6b81;
    }

    .btn-mic {
      background: #0f3460;
      color: white;
      position: relative;
    }

    .btn-mic:hover {
      background: #1a4a8a;
    }

    .btn-mic.recording {
      background: #e94560;
      animation: pulse 1s infinite;
    }

    .btn-audio {
      display: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .thinking {
      align-self: flex-start;
      color: #888;
      font-style: italic;
      padding: 8px 16px;
    }

    .thinking::after {
      content: '';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #speedSlider {
      display: none;
    }

    /* Mobile optimizations */
    @media (max-width: 600px) {
      .message {
        max-width: 90%;
      }
      .header h1 {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 Personal Assistant</h1>
    <div class="subtitle">Gemma 4 12B · Push to talk or type</div>
    <div class="context-bar">
      <div class="context-bar-fill" id="contextBarFill"></div>
    </div>
    <div class="context-label" id="contextLabel">Context: 0%</div>
  </div>

  <div class="chat-container" id="chat">
    <div class="message system">Ready. Hold the mic button to speak, or type below.</div>
  </div>

  <div class="input-area">
    <button class="btn btn-mic" id="micBtn" title="Hold to speak">
      🎤
    </button>
    <input
      type="text"
      class="text-input"
      id="textInput"
      placeholder="Type a message..."
      autocomplete="off"
    >
    <div class="controls">
      <button class="btn btn-stop" id="stopBtn" title="Stop speech" style="display:none;">
        ⏹
      </button>
      <button class="btn btn-send" id="sendBtn" title="Send">
        ➤
      </button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat')
    const textInput = document.getElementById('textInput')
    const sendBtn = document.getElementById('sendBtn')
    const micBtn = document.getElementById('micBtn')
    const stopBtn = document.getElementById('stopBtn')

    let isLoading = false
    let recognition = null
    let isRecording = false

    // ===== Chat =====
    function addMessage(role, content) {
      const div = document.createElement('div')
      div.className = `message ${role}`
      div.textContent = content
      chat.appendChild(div)
      chat.scrollTop = chat.scrollHeight
    }

    function showThinking() {
      const div = document.createElement('div')
      div.className = 'thinking'
      div.id = 'thinking'
      div.textContent = '⏳ Thinking'
      chat.appendChild(div)
      chat.scrollTop = chat.scrollHeight
    }

    function hideThinking() {
      const el = document.getElementById('thinking')
      if (el) el.remove()
    }

    async function sendMessage(text) {
      const trimmed = text.trim()
      if (!trimmed || isLoading) return

      addMessage('user', trimmed)
      textInput.value = ''
      isLoading = true
      sendBtn.disabled = true
      showThinking()

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: trimmed }),
        })

        hideThinking()

        if (!res.ok || !res.body) {
          const text = await res.text()
          try {
            const data = JSON.parse(text)
            addMessage('system', `❌ ${data.error || 'Unknown error'}`)
          } catch {
            addMessage('system', `❌ ${text}`)
          }
          return
        }

        // Create assistant message element for streaming
        const msgDiv = document.createElement('div')
        msgDiv.className = 'message assistant'
        msgDiv.textContent = ''
        chat.appendChild(msgDiv)

        let fullText = ''
        const reader = res.body.getReader()
        const decoder = new TextDecoder()
        let buffer = ''

        while (true) {
          const { done, value } = await reader.read()
          if (done) break

          buffer += decoder.decode(value, { stream: true })
          const lines = buffer.split('\n')
          // Keep the last incomplete line in buffer
          buffer = lines.pop() || ''

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const data = JSON.parse(line.slice(6))
                if (data.type === 'text') {
                  fullText += data.content
                  msgDiv.textContent = fullText
                  chat.scrollTop = chat.scrollHeight
                } else if (data.type === 'error') {
                  msgDiv.className = 'message system'
                  msgDiv.textContent = `❌ ${data.content}`
                }
              } catch {}
            }
          }
        }

        if (audioEnabled && fullText) {
          speakText(fullText)
        }
      } catch (err) {
        hideThinking()
        addMessage('system', `❌ Connection error: ${err.message}`)
      } finally {
        isLoading = false
        sendBtn.disabled = false
        updateContextUsage()
      }
    }

    // ===== TTS (Browser SpeechSynthesis) =====
    let speechRate = 2.0

    function speakText(text) {
      if (!('speechSynthesis' in window)) return
      window.speechSynthesis.cancel()

      const utterance = new SpeechSynthesisUtterance(text)
      utterance.rate = speechRate

      // Detect language
      const hasChinese = /[\u4e00-\u9fff\u3400-\u4dbf]/.test(text)
      utterance.lang = hasChinese ? 'zh-HK' : 'en-US'

      // Try to find a female voice for the target language
      const voices = window.speechSynthesis.getVoices()
      const targetLang = hasChinese ? 'zh-HK' : 'en'
      const femaleVoice = voices.find(v => v.lang.startsWith(targetLang) && /female/i.test(v.name))
        || voices.find(v => v.lang.startsWith(targetLang) && /woman|girl|zira|tracy|hui|sinji/i.test(v.name))
        || voices.find(v => v.lang.startsWith(targetLang))
      if (femaleVoice) utterance.voice = femaleVoice

      // Show stop button while speaking
      stopBtn.style.display = 'flex'
      utterance.onend = () => { stopBtn.style.display = 'none' }
      utterance.onerror = () => { stopBtn.style.display = 'none' }

      window.speechSynthesis.speak(utterance)
    }

    // Load voices (needed for some browsers)
    if ('speechSynthesis' in window) {
      speechSynthesis.getVoices()
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices()
    }

    // ===== STT (Web Speech API) =====
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
      if (!SpeechRecognition) {
        micBtn.style.display = 'none'
        return
      }

      recognition = new SpeechRecognition()
      recognition.continuous = true
      recognition.interimResults = false
      recognition.lang = 'zh-HK'

      recognition.onresult = (event) => {
        let text = ''
        for (let i = 0; i < event.results.length; i++) {
          text += event.results[i][0].transcript
        }
        recognition._transcript = text
      }

      recognition.onend = () => {
        isRecording = false
        micBtn.classList.remove('recording')
        const text = recognition._transcript || ''
        recognition._transcript = ''
        if (text.trim()) {
          sendMessage(text.trim())
        }
      }

      recognition.onerror = (event) => {
        isRecording = false
        micBtn.classList.remove('recording')
        if (event.error !== 'no-speech' && event.error !== 'aborted') {
          addMessage('system', `🎤 Error: ${event.error}`)
        }
      }
    }

    function startRecording() {
      if (!recognition || isLoading) return
      // Stop any ongoing speech
      window.speechSynthesis.cancel()
      stopBtn.style.display = 'none'
      isRecording = true
      recognition._transcript = ''
      micBtn.classList.add('recording')
      try { recognition.start() } catch(e) {}
    }

    function stopRecording() {
      if (!recognition || !isRecording) return
      try { recognition.stop() } catch(e) {}
    }

    // ===== Event Listeners =====

    // Send button
    sendBtn.addEventListener('click', () => {
      sendMessage(textInput.value)
    })

    // Enter key
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault()
        sendMessage(textInput.value)
      }
    })

    // Push-to-talk: hold to record
    micBtn.addEventListener('mousedown', (e) => {
      e.preventDefault()
      startRecording()
    })
    micBtn.addEventListener('mouseup', () => stopRecording())
    micBtn.addEventListener('mouseleave', () => stopRecording())

    // Touch events for mobile
    micBtn.addEventListener('touchstart', (e) => {
      e.preventDefault()
      startRecording()
    })
    micBtn.addEventListener('touchend', (e) => {
      e.preventDefault()
      stopRecording()
    })

    // Audio toggle removed — always on
    let audioEnabled = true

    // Load audio config from server
    fetch('/api/config')
      .then(r => r.json())
      .then(config => { audioEnabled = config.audioEnabled })
      .catch(() => {})

    // Update context usage indicator
    function updateContextUsage() {
      fetch('/api/context-usage')
        .then(r => r.json())
        .then(data => {
          const fill = document.getElementById('contextBarFill')
          const label = document.getElementById('contextLabel')
          fill.style.width = data.percentage + '%'
          fill.classList.remove('warning', 'critical')
          if (data.percentage >= 70) fill.classList.add('critical')
          else if (data.percentage >= 50) fill.classList.add('warning')
          label.textContent = `Context: ${data.percentage}% (${data.tokens}/${data.limit} tokens)`
        })
        .catch(() => {})
    }
    updateContextUsage()

    // Stop speech button
    stopBtn.addEventListener('click', () => {
      window.speechSynthesis.cancel()
      stopBtn.style.display = 'none'
    })

    // Initialize
    setupSpeechRecognition()
  </script>
</body>
</html>
